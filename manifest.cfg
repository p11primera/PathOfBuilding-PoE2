[default]
path =
include-files = changelog.txt,LICENSE.md,help.txt
include-directories =

[runtime]
path = runtime
exclude-files = lua-profiler.lua,msvcr100.dll,SimpleGraphic.cfg,Update.exe,imgui.ini
exclude-directories = 

[runtime-mac]
# Placeholder — macOS runtime dylibs are bundled by package-macos.sh, not
# distributed via the manifest update mechanism. This section exists so
# update_manifest.py --platform mac can generate a valid macOS manifest.xml
# once macOS-specific runtime files are added to runtime-mac/ in the future.
path = runtime-mac
exclude-files =
exclude-directories =

[program]
path = src
exclude-files = HeadlessWrapper.lua,LaunchInstall.lua,Settings.xml
exclude-directories = src/Export,src/TreeData,src/Builds,src/luacov.stats.out,src/Data/TimelessJewelData/BrutalRestraint.bin,src/Data/TimelessJewelData/ElegantHubris.bin,src/Data/TimelessJewelData/GloriousVanity.bin,src/Data/TimelessJewelData/LethalPride.bin,src/Data/TimelessJewelData/MilitantFaith.bin,src/poe_api_response.json

[tree]
path = src
exclude-files = *.scm,export_lines.bat,log_lines_extract.txt,missingStats.txt
include-directories = src/TreeData
