name: Build macOS (arm64)

on:
  push:
    branches:
      - feature/mac-os-port
      - dev
      - master
  pull_request:
    branches:
      - dev
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sg_ref:
        description: 'SimpleGraphic branch/tag to build'
        required: false
        default: 'feature/macos-port'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-macos:
    runs-on: macos-14  # macos-14 = M1 arm64; macos-latest may resolve to x86_64

    steps:
      - name: Checkout PoB2 repo
        uses: actions/checkout@v4

      - name: Checkout SimpleGraphic
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PathOfBuilding-SimpleGraphic
          ref: ${{ github.event.inputs.sg_ref || 'feature/macos-port' }}
          path: SimpleGraphic
          submodules: recursive

      - name: Get SimpleGraphic commit SHA
        id: sg_sha
        run: echo "sha=$(git -C SimpleGraphic rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find completed SimpleGraphic macOS build for this SHA
        id: sg_run
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository_owner }}/PathOfBuilding-SimpleGraphic/actions/workflows/main.yml/runs?head_sha=${{ steps.sg_sha.outputs.sha }}&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | first | .id // ""')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download SimpleGraphic macOS install artifacts
        id: sg_download
        if: steps.sg_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: SimpleGraphic-arm64-osx
          path: sg-install
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/PathOfBuilding-SimpleGraphic
          run-id: ${{ steps.sg_run.outputs.run_id }}
        continue-on-error: true

      - name: Install dependencies (fallback build only)
        if: steps.sg_download.outcome != 'success'
        run: |
          brew install cmake ninja

      - name: Configure SimpleGraphic (fallback build only)
        if: steps.sg_download.outcome != 'success'
        working-directory: SimpleGraphic
        run: |
          SDK=$(xcrun --show-sdk-path)
          cmake -B build -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DVCPKG_OVERLAY_TRIPLETS=./vcpkg-triplets \
            -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build SimpleGraphic (fallback build only)
        if: steps.sg_download.outcome != 'success'
        working-directory: SimpleGraphic
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Install SimpleGraphic artifacts (fallback build only)
        if: steps.sg_download.outcome != 'success'
        working-directory: SimpleGraphic
        run: cmake --install build --prefix ../sg-install

      - name: Install test dependencies
        run: |
          brew install luarocks luajit
          luarocks --lua-version=5.1 install busted
          luarocks --lua-version=5.1 install luacov-coveralls

      - name: Run tests
        # LUAJIT_NO_JIT=1: the optimizer spec suite hangs the macOS ARM64 JIT
        # in the simulated-annealing hot loop (80+ min wedge; with interpreter
        # mode the whole suite passes 997/997 in ~110s. Linux CI unaffected).
        # TAP output is unsuitable here: its handler exits 1 despite 0 failures.
        timeout-minutes: 30
        env:
          LUAJIT_NO_JIT: "1"
        run: |
          eval $(luarocks --lua-version=5.1 path)
          # Prepend sg-install paths so busted can find lua-utf8.so / lcurl.so etc.
          # On macOS, SHARED library targets install to Frameworks/; also check root.
          export LUA_CPATH="$GITHUB_WORKSPACE/sg-install/Frameworks/?.so;$GITHUB_WORKSPACE/sg-install/?.so;$LUA_CPATH"
          busted --lua=luajit

      # JIT verification (trial of luajit port patch 008 / LuaJIT#1520 fix):
      # run the optimizer specs on the BUNDLED engine with JIT enabled.
      # Pre-patch, the macOS W^X mcode-allocation storm wedged this for 80+
      # min. The alarm bounds the run; completion in minutes = fix works.
      - name: JIT verification — optimizer specs on bundled LuaJIT
        if: ${{ hashFiles('spec/System/TestTreeOptimizer_spec.lua') != '' }}
        timeout-minutes: 15
        run: |
          SG_LJ=$(find "$GITHUB_WORKSPACE/sg-install" -type f -name luajit | head -1)
          if [ -z "$SG_LJ" ]; then echo "FATAL: no luajit binary in sg-install artifacts"; exit 1; fi
          chmod +x "$SG_LJ" 2>/dev/null || true
          "$SG_LJ" -v
          eval $(luarocks --lua-version=5.1 path)
          export LUA_CPATH="$GITHUB_WORKSPACE/sg-install/Frameworks/?.so;$GITHUB_WORKSPACE/sg-install/?.so;$LUA_CPATH"
          BUSTED=$(command -v busted)
          perl -e 'alarm 600; exec @ARGV or die "exec failed: $!"' \
            "$SG_LJ" "$BUSTED" spec/System/TestTreeOptimizer_spec.lua

      - name: Package .app bundle
        run: ./package-macos.sh ./sg-install ./dist

      - name: Smoke test — verify app starts up
        # The SG engine runs `while (sys->Run())` — a frame pump that never
        # exits on its own in a headless environment (the wrapper's no-op
        # RenderInit prevents window creation, nothing breaks the loop).
        # Run it under a hard alarm so it prints startup output and gets
        # killed; judge the smoke test by the output, not the exit code.
        # </dev/null guards against HeadlessWrapper's io.read("*l") prompt path.
        timeout-minutes: 10
        run: |
          BINARY="dist/Path of Building-PoE2.app/Contents/MacOS/Path of Building-PoE2"
          OUTPUT=$(perl -e 'alarm 120; exec @ARGV or die "exec failed: $!"' \
            "$BINARY" src/HeadlessWrapper.lua </dev/null 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Startup time" || \
            { echo "Smoke test FAILED: 'Startup time' not found in output"; exit 1; }

      - name: Zip app bundle
        run: |
          # Strip quarantine and extended attributes before archiving so the zip
          # does not carry them.  Users will still need to run
          #   xattr -cr "Path of Building-PoE2.app"
          # after downloading because macOS re-applies com.apple.quarantine to
          # anything fetched from the internet.  Without notarization this is
          # unavoidable; see README for instructions.
          xattr -cr "dist/Path of Building-PoE2.app"
          ditto -c -k --keepParent \
            "dist/Path of Building-PoE2.app" \
            "dist/Path-of-Building-PoE2-macos.zip"

      - name: Upload artifact (CI builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pob2-macos-arm64
          path: dist/Path-of-Building-PoE2-macos.zip
          retention-days: 14

      - name: Upload to release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/Path-of-Building-PoE2-macos.zip" --clobber \
            -R "${{ github.repository }}"
