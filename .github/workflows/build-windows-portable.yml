name: Build Windows (portable zip)

on:
  push:
    branches:
      - feature/mac-os-port
  workflow_dispatch:
    inputs:
      sg_ref:
        description: 'SimpleGraphic branch/tag to pull DLLs from'
        required: false
        default: 'feature/macos-port'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout PoB2 repo
        uses: actions/checkout@v4

      - name: Checkout SimpleGraphic
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PathOfBuilding-SimpleGraphic
          ref: ${{ github.event.inputs.sg_ref || 'feature/macos-port' }}
          path: SimpleGraphic
          submodules: recursive

      - name: Get SimpleGraphic commit SHA
        id: sg_sha
        run: echo "sha=$(git -C SimpleGraphic rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find completed SimpleGraphic Windows build for this SHA
        id: sg_run
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository_owner }}/PathOfBuilding-SimpleGraphic/actions/workflows/main.yml/runs?head_sha=${{ steps.sg_sha.outputs.sha }}&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | first | .id // ""')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download SimpleGraphic.dll artifact
        id: sg_dll
        if: steps.sg_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: SimpleGraphic-x64-windows.dll
          path: sg-dlls
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/PathOfBuilding-SimpleGraphic
          run-id: ${{ steps.sg_run.outputs.run_id }}
        continue-on-error: true

      - name: Download SimpleGraphic dependency DLLs artifact
        id: sg_deps
        if: steps.sg_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: SimpleGraphic-x64-windows-deps.dll
          path: sg-dlls
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/PathOfBuilding-SimpleGraphic
          run-id: ${{ steps.sg_run.outputs.run_id }}
        continue-on-error: true

      - name: Overlay fresh DLLs into runtime (if downloaded)
        # Falls back silently to the DLLs already committed in runtime/ if the
        # artifact download failed.
        if: steps.sg_dll.outcome == 'success'
        run: cp sg-dlls/*.dll runtime/

      - name: Stage portable directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\pob2-win-portable | Out-Null

          # Runtime: exe + DLLs + SimpleGraphic/ fonts dir + lua/ scripts.
          # Mirrors the [runtime] exclusions in manifest.cfg.
          $runtimeExclude = @('lua-profiler.lua','msvcr100.dll','SimpleGraphic.cfg','Update.exe','imgui.ini')
          Get-ChildItem -Path runtime -Recurse | Where-Object {
            $_.Name -notin $runtimeExclude
          } | ForEach-Object {
            $rel  = $_.FullName.Substring((Resolve-Path runtime).Path.Length + 1)
            $dest = "dist\pob2-win-portable\$rel"
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item $_.FullName $dest
          }

          # PoB2 Lua source — mirrors the [program] exclusions in manifest.cfg.
          $srcExcludeDirs  = @('Export','Builds','TreeData')
          $srcExcludeFiles = @('Settings.xml','poe_api_response.json','luacov.stats.out',
                               'HeadlessWrapper.lua','LaunchInstall.lua')
          $timelessBins    = Get-ChildItem src\Data\TimelessJewelData -Filter *.bin -ErrorAction SilentlyContinue |
                               Select-Object -ExpandProperty FullName
          Get-ChildItem -Path src -Recurse | Where-Object {
            $rel = $_.FullName.Substring((Resolve-Path src).Path.Length + 1)
            $topDir = $rel.Split([IO.Path]::DirectorySeparatorChar)[0]
            if ($_.PSIsContainer) { return $false }
            if ($topDir -in $srcExcludeDirs) { return $false }
            if ($_.Name -in $srcExcludeFiles) { return $false }
            if ($timelessBins -contains $_.FullName) { return $false }
            return $true
          } | ForEach-Object {
            $rel  = $_.FullName.Substring((Resolve-Path src).Path.Length + 1)
            $dest = "dist\pob2-win-portable\src\$rel"
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item $_.FullName $dest
          }

          # TreeData: .lua/.json for all versions (calc compat with old builds),
          # image assets only for the latest version — mirrors macOS policy.
          $latestTree = (Select-String -Path src\GameVersions.lua -Pattern 'treeVersionList\s*=' |
                          Select-Object -First 1).Line |
                          Select-String -Pattern '"(0_\d+)"' -AllMatches |
                          Select-Object -ExpandProperty Matches |
                          Select-Object -Last 1 |
                          ForEach-Object { $_.Groups[1].Value }
          if (-not $latestTree) { $latestTree = '0_4' }
          Write-Host "Latest tree version: $latestTree"

          foreach ($verDir in Get-ChildItem src\TreeData -Directory) {
            $ver  = $verDir.Name
            $dest = "dist\pob2-win-portable\src\TreeData\$ver"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            # Always copy data files
            Get-ChildItem $verDir.FullName -File |
              Where-Object { $_.Extension -in '.lua','.json' } |
              ForEach-Object { Copy-Item $_.FullName $dest }
            # Image assets only for the latest version
            if ($ver -eq $latestTree) {
              Get-ChildItem $verDir.FullName -File |
                Where-Object { $_.Extension -notin '.lua','.json' } |
                ForEach-Object { Copy-Item $_.FullName $dest }
            }
          }

          # Top-level assets
          Copy-Item changelog.txt,LICENSE.md,help.txt dist\pob2-win-portable\

          # manifest.xml must live beside Launch.lua (in src/) so the engine finds it.
          # Without it devMode stays false, the update check fires on launch, and the
          # UI immediately shows "Update check failed! Invalid local manifest".
          # With it (no branch attr): devMode = true, update checks suppressed, and
          # Version: 0.15.0 shows correctly in the about panel.
          Copy-Item manifest.xml dist\pob2-win-portable\src\

      - name: Zip portable package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path   "dist\pob2-win-portable\*" `
            -DestinationPath "dist\PathOfBuilding-PoE2-win-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pob2-windows-portable
          path: dist/PathOfBuilding-PoE2-win-portable.zip
          retention-days: 14
